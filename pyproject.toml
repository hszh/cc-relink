[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cc-relink"
version = "0.1.0"
description = "Re-link broken parentUuid chains in Claude Code session transcripts — recover assistant replies that vanish after resume"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "hszh", email = "zhaohsh@foxmail.com" }]
keywords = [
    "claude-code",
    "claude-code-session",
    "session-resume",
    "transcript-repair",
    "parentuuid",
    "api-error",
    "data-recovery",
    "jsonl",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/hszh/cc-relink"
Issues = "https://github.com/hszh/cc-relink/issues"

[project.scripts]
cc-relink = "cc_relink:main"

[tool.setuptools]
py-modules = ["cc_relink"]
